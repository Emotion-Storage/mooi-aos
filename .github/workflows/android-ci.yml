name: Android CI - Build & Run KtLint with reviewdog

on:
    push:
        branches: [ "develop" ]
    pull_request:
        branches: [ "develop" ]

jobs:
    build:
        runs-on: ubuntu-latest
        env:
            MOOI_DEV_SERVER_URL: ${{ secrets.MOOI_DEV_SERVER_URL }}
            MOOI_PROD_SERVER_URL: ${{ secrets.MOOI_PROD_SERVER_URL }}
            MOOI_REPLY_EMAIL: ${{ secrets.MOOI_REPLY_EMAIL }}
            GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
            KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}

        steps:
            -   uses: actions/checkout@v4

            -   name: Decode debug keystore
                run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore

            -   name: Set signing env vars
                run: |
                    echo "RELEASE_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
                    echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
                    echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
                    echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV

            -   name: Create Google Services JSON File
                env:
                    GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
                run: echo $GOOGLE_SERVICES_JSON | base64 -di > app/google-services.json

            -   name: Set up JDK 17
                uses: actions/setup-java@v4
                with:
                    java-version: '17'
                    distribution: 'temurin'
                    cache: gradle

            -   name: Grant execute permission for gradlew
                run: chmod +x gradlew

            -   name: Build Debug APK only
                run: ./gradlew assembleDebug

    ktlint:
        name: Check Code Quality
        runs-on: ubuntu-latest

        steps:
            -   name: Clone repo
                uses: actions/checkout@master
                with:
                    fetch-depth: 1
            -   name: ktlint
                uses: ScaCap/action-ktlint@master
                with:
                    github_token: ${{ secrets.REVIEWDOG_GITHUB_TOKEN }}
                    level: warning
                    reporter: github-pr-review
