name: Deploy to Firebase on Manual action

on:
    workflow_dispatch:
        inputs:
            release_notes:
                type: string
                required: true
                default: 'Manual Debug Build'
                description: 'Release Notes'

jobs:
    build:
        name: Building and distributing app
        runs-on: ubuntu-latest
        env:
            MOOI_DEV_SERVER_URL: ${{ secrets.MOOI_DEV_SERVER_URL }}
            MOOI_PROD_SERVER_URL: ${{ secrets.MOOI_PROD_SERVER_URL }}
            MOOI_REPLY_EMAIL: ${{ secrets.MOOI_REPLY_EMAIL }}
            GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
            KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}

        steps:
            -   uses: actions/checkout@v4

            -   name: Decode debug keystore
                run: echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > debug.keystore

            -   name: Set signing env vars
                run: |
                    echo "RELEASE_KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
                    echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
                    echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
                    echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV

            -   name: Create Google Services JSON File
                env:
                    GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
                run: echo $GOOGLE_SERVICES_JSON | base64 -di > app/google-services.json

            -   name: set up JDK 17
                uses: actions/setup-java@v4
                with:
                    distribution: 'temurin'
                    java-version: '17'

            -   name: Grant execute permission for gradlew
                run: chmod +x ./gradlew

            -   name: Build Debug APK only
                run: ./gradlew assembleDebug

            -   name: Upload Artifact to Firebase App Distribution
                uses: wzieba/Firebase-Distribution-Github-Action@v1
                with:
                    appId: ${{ secrets.FIREBASE_APP_ID }}
                    serviceCredentialsFileContent: ${{ secrets.CREDENTIAL_FILE_CONTENT }}
                    groups: "testersteam"
                    file: app/build/outputs/apk/debug/app-debug.apk
                    releaseNotes: ${{ inputs.release_notes }}
